<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 · KorvusDev</title><style>:root{--bg:#0a0e14;--bg2:#10161f;--card:#141b26;--line:#222c3a;--tx:#e8edf4;--mut:#93a1b5;--ac:#5eead4;--ac2:#a78bfa;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2a3f55,transparent),var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:#0a0e14cc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:800;letter-spacing:.2px;color:var(--tx)}.brand span{color:var(--ac)}
nav a{color:var(--mut);margin-left:16px;font-size:14px}nav a:hover{color:var(--tx);text-decoration:none}
h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:.2em 0}
h2{font-size:22px;margin:2.2em 0 .6em;padding-bottom:.35em;border-bottom:1px solid var(--line)}
h3{font-size:17px;margin:1.6em 0 .4em;color:var(--ac)}
p,li{color:#cfd8e5}ul{padding-left:1.2em}li{margin:.3em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ac);text-decoration:none}.btn.p{background:var(--ac);color:#04221d;border-color:var(--ac)}
.btn svg{width:18px;height:18px;fill:currentColor}
.muted{color:var(--mut)}.small{font-size:14px}
footer{margin-top:64px;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}th{background:var(--bg2);color:var(--tx)}td{color:#cfd8e5}
